<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiaTV Web - Reproductor IPTV HD</title>
  <!-- TailWind CSS & HLS.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .video-aspect { aspect-ratio: 16 / 9; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans">

  <!-- BARRA DE NAVEGACIÓN -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center z-10">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-tv text-red-500 text-2xl"></i>
      <h1 class="text-xl font-bold tracking-wide">Gia<span class="text-red-500">TV</span></h1>
    </div>
    <div class="flex items-center space-x-3">
      <button id="btnOpenAdmin" onclick="showAdminModal()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg border border-slate-700 transition">
        <i class="fa-solid fa-lock mr-1"></i> Admin Panel
      </button>
      <button id="btnLogout" onclick="logoutAdmin()" class="hidden bg-red-600 hover:bg-red-700 text-xs px-3 py-2 rounded-lg transition">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> Salir
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
    
    <!-- REPRODUCTOR DE VIDEO -->
    <div class="w-full md:w-2/3 lg:w-3/4 bg-black flex flex-col justify-center items-center relative">
      <div class="w-full video-aspect max-h-[70vh] relative bg-slate-950 flex items-center justify-center">
        <video id="videoPlayer" class="w-full h-full" controls autoplay></video>
        <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500">
          <i class="fa-solid fa-circle-play text-6xl mb-3 opacity-50"></i>
          <p>Selecciona un canal para reproducir</p>
        </div>
      </div>
      <!-- Barra del canal actual -->
      <div class="w-full bg-slate-900 p-4 flex items-center justify-between border-t border-slate-800">
        <div class="flex items-center space-x-3">
          <img id="currentLogo" src="" class="w-10 h-10 object-contain rounded hidden bg-slate-800 p-1" alt="Logo">
          <div>
            <h2 id="currentChannelTitle" class="font-bold text-lg">Bienvenido a GiaTV</h2>
            <p id="currentChannelCategory" class="text-xs text-slate-400">Selecciona una categoría</p>
          </div>
        </div>
        <span class="bg-red-500/10 text-red-500 border border-red-500/20 text-xs px-2.5 py-1 rounded-full font-semibold">HD LIVE</span>
      </div>
    </div>

    <!-- LISTA DE CANALES Y CATEGORÍAS -->
    <div class="w-full md:w-1/3 lg:w-1/4 bg-slate-900 border-l border-slate-800 flex flex-col h-full overflow-hidden">
      <!-- Filtro por Categorías -->
      <div class="p-3 border-b border-slate-800">
        <select id="categoryFilter" onchange="filterChannels()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
          <option value="ALL">Todas las Categorías</option>
        </select>
      </div>

      <!-- Lista de canales -->
      <div id="channelList" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
        <!-- Canales renderizados dinámicamente -->
      </div>
    </div>
  </div>

  <!-- MODAL DE LOGIN / ADMIN -->
  <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-6 relative">
      <button onclick="hideAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <!-- Vista 1: Login -->
      <div id="loginForm" class="space-y-4">
        <h3 class="text-xl font-bold flex items-center"><i class="fa-solid fa-shield-halved text-red-500 mr-2"></i> Acceso Administrador</h3>
        <div>
          <label class="text-xs text-slate-400">Usuario</label>
          <input type="text" id="adminUser" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs text-slate-400">Contraseña</label>
          <input type="password" id="adminPass" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm mt-1">
        </div>
        <p id="loginError" class="text-xs text-red-500 hidden">Usuario o contraseña incorrectos</p>
        <button onclick="loginAdmin()" class="w-full bg-red-600 hover:bg-red-700 font-bold py-2 rounded text-sm transition">Ingresar</button>
      </div>

      <!-- Vista 2: Panel de Administración -->
      <div id="adminPanel" class="space-y-4 hidden">
        <h3 class="text-xl font-bold border-b border-slate-800 pb-2">Panel de Control</h3>
        
        <div class="space-y-3">
          <h4 class="text-sm font-semibold text-slate-300">Agregar Nuevo Canal</h4>
          <input type="text" id="newTitle" placeholder="Nombre del Canal (Ej: ESPN HD)" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm">
          <input type="text" id="newCategory" placeholder="Categoría (Ej: Deportes, Noticias)" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm">
          <input type="url" id="newStreamUrl" placeholder="URL Stream (.m3u8)" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm">
          <input type="url" id="newLogoUrl" placeholder="URL Logo PNG/JPG" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm">
          <button onclick="addChannel()" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-2 rounded text-sm transition">Guardar Canal</button>
        </div>

        <div class="border-t border-slate-800 pt-3">
          <h4 class="text-sm font-semibold text-slate-300 mb-2">Canales Guardados</h4>
          <div id="adminChannelList" class="max-h-40 overflow-y-auto custom-scrollbar space-y-2">
            <!-- Lista gestionable -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuración Base de Canales por Defecto
    const initialChannels = [
      { id: 1, name: "TN HD (Argentina)", category: "Noticias", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/TN_logo_2021.svg/320px-TN_logo_2021.svg.png", url: "https://live-tn.artear.com/live/tn/playlist.m3u8" },
      { id: 2, name: "Red Bull TV HD", category: "Deportes", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Red_Bull_TV_logo.svg/320px-Red_Bull_TV_logo.svg.png", url: "https://rbmn-live.akamaized.net/hls/live/591070/GEO_GLOBAL/master.m3u8" }
    ];

    let channels = JSON.parse(localStorage.getItem("giatv_channels")) || initialChannels;
    let hls = new Hls();
    let isAdminLoggedIn = false;

    document.addEventListener("DOMContentLoaded", () => {
      renderCategories();
      renderChannels(channels);
    });

    // Renderizar Canales
    function renderChannels(items) {
      const container = document.getElementById("channelList");
      container.innerHTML = "";
      items.forEach(c => {
        container.innerHTML += `
          <div onclick="playChannel('${c.url}', '${c.name}', '${c.category}', '${c.logo}')" 
               class="flex items-center space-x-3 p-2.5 rounded-lg hover:bg-slate-800 cursor-pointer transition border border-transparent hover:border-slate-700">
            <img src="${c.logo}" class="w-9 h-9 object-contain bg-slate-950 p-1 rounded" onerror="this.src='https://via.placeholder.com/36?text=TV'">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate">${c.name}</p>
              <p class="text-xs text-slate-500 truncate">${c.category}</p>
            </div>
            <i class="fa-solid fa-play text-xs text-slate-600"></i>
          </div>`;
      });
    }

    // Renderizar Categorías
    function renderCategories() {
      const select = document.getElementById("categoryFilter");
      const categories = ["ALL", ...new Set(channels.map(c => c.category))];
      select.innerHTML = categories.map(cat => `<option value="${cat}">${cat === 'ALL' ? 'Todas las Categorías' : cat}</option>`).join('');
    }

    function filterChannels() {
      const cat = document.getElementById("categoryFilter").value;
      const filtered = cat === "ALL" ? channels : channels.filter(c => c.category === cat);
      renderChannels(filtered);
    }

    // Reproductor HLS
    function playChannel(url, title, category, logo) {
      const video = document.getElementById("videoPlayer");
      const placeholder = document.getElementById("playerPlaceholder");
      placeholder.classList.add("hidden");
      
      document.getElementById("currentChannelTitle").innerText = title;
      document.getElementById("currentChannelCategory").innerText = category;
      const imgLogo = document.getElementById("currentLogo");
      if(logo) { imgLogo.src = logo; imgLogo.classList.remove("hidden"); }

      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    // Funciones Modal & Admin
    function showAdminModal() { document.getElementById("adminModal").classList.remove("hidden"); }
    function hideAdminModal() { document.getElementById("adminModal").classList.add("hidden"); }

    function loginAdmin() {
      const u = document.getElementById("adminUser").value;
      const p = document.getElementById("adminPass").value;
      if (u === "admin" && p === "admin123") {
        isAdminLoggedIn = true;
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        document.getElementById("btnOpenAdmin").classList.add("hidden");
        document.getElementById("btnLogout").classList.remove("hidden");
        renderAdminList();
      } else {
        document.getElementById("loginError").classList.remove("hidden");
      }
    }

    function logoutAdmin() {
      isAdminLoggedIn = false;
      document.getElementById("loginForm").classList.remove("hidden");
      document.getElementById("adminPanel").classList.add("hidden");
      document.getElementById("btnOpenAdmin").classList.remove("hidden");
      document.getElementById("btnLogout").classList.add("hidden");
      hideAdminModal();
    }

    function addChannel() {
      const name = document.getElementById("newTitle").value;
      const category = document.getElementById("newCategory").value;
      const url = document.getElementById("newStreamUrl").value;
      const logo = document.getElementById("newLogoUrl").value;

      if (!name || !category || !url) return alert("Completa los campos requeridos");

      const newChan = { id: Date.now(), name, category, url, logo };
      channels.push(newChan);
      localStorage.setItem("giatv_channels", JSON.stringify(channels));
      
      renderCategories();
      renderChannels(channels);
      renderAdminList();

      document.getElementById("newTitle").value = "";
      document.getElementById("newCategory").value = "";
      document.getElementById("newStreamUrl").value = "";
      document.getElementById("newLogoUrl").value = "";
    }

    function deleteChannel(id) {
      channels = channels.filter(c => c.id !== id);
      localStorage.setItem("giatv_channels", JSON.stringify(channels));
      renderCategories();
      renderChannels(channels);
      renderAdminList();
    }

    function renderAdminList() {
      const list = document.getElementById("adminChannelList");
      list.innerHTML = channels.map(c => `
        <div class="flex items-center justify-between bg-slate-800 p-2 rounded text-xs">
          <span class="truncate w-2/3">${c.name} (${c.category})</span>
          <button onclick="deleteChannel(${c.id})" class="text-red-400 hover:text-red-300">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
