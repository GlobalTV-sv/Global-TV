<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTV IP - Plataforma IPTV</title>
    <!-- Librería HLS ligera para compatibilidad móvil -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3b82f6;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-live {
            background-color: #ef4444;
            color: white;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
        }

        @media (min-width: 900px) {
            .main-container { flex-direction: row; }
        }

        .player-section {
            width: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 900px) {
            .player-section { flex: 3; }
        }

        .video-wrapper {
            width: 100%;
            position: relative;
            padding-top: 56.25%;
            background-color: #000;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .channel-info {
            padding: 15px;
            background-color: #1e293b;
        }

        .channel-info h2 {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .channel-info p {
            color: #94a3b8;
            font-size: 13px;
        }

        .sidebar {
            width: 100%;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 900px) {
            .sidebar {
                flex: 1;
                min-width: 320px;
                max-width: 400px;
                border-left: 1px solid #334155;
                height: calc(100vh - 57px);
            }
        }

        .category-filter {
            padding: 10px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .cat-btn {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 16px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-btn.active {
            background: #2563eb;
            font-weight: bold;
        }

        .channel-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
        }

        .channel-item:active, .channel-item.active {
            background-color: #2563eb;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            margin-right: 12px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
        }

        .channel-details h4 {
            font-size: 14px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .channel-details span {
            font-size: 12px;
            color: #94a3b8;
        }

        .badge-tag {
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
            background: #3b82f6;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌐 GLOBAL TV IP</div>
        <div><span class="badge-live">EN VIVO</span></div>
    </header>

    <div class="main-container">
        <div class="player-section">
            <div class="video-wrapper">
                <video id="video-player" controls playsinline webkit-playsinline muted autoplay></video>
            </div>
            <div class="channel-info">
                <h2 id="current-channel-title">Cargando señal...</h2>
                <p id="current-channel-desc">Selecciona un canal de la lista.</p>
            </div>
        </div>

        <div class="sidebar">
            <div class="category-filter">
                <button class="cat-btn active" onclick="filterCategory('Todas')">Todas</button>
                <button class="cat-btn" onclick="filterCategory('Canal Propio')">Propio</button>
                <button class="cat-btn" onclick="filterCategory('Noticias')">Noticias</button>
                <button class="cat-btn" onclick="filterCategory('Deportes')">Deportes</button>
                <button class="cat-btn" onclick="filterCategory('Entretenimiento')">Entretenimiento</button>
            </div>
            <ul class="channel-list" id="channel-list"></ul>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-player');
        let hlsPlayer = null;
        let currentCategory = 'Todas';

        // 📌 LISTA PERMANENTE DE CANALES GLOBALES
        // Agrega aquí los canales que quieras que vean todos los usuarios en cualquier dispositivo
        const channels = [
            {
                id: 1,
                name: "Mi Canal TV",
                category: "Canal Propio",
                quality: "HD",
                url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
                tag: "MI TV",
                desc: "Canal exclusivo con transmisión las 24 horas."
            },
            {
                id: 2,
                name: "Noticias Global HD",
                category: "Noticias",
                quality: "HD",
                url: "https://cdn.jwplayer.com/manifests/pBScAFlM.m3u8",
                tag: "NEWS",
                desc: "Información y noticias internacionales."
            },
            {
                id: 3,
                name: "AGAPE TV HD",
                category: "Entretenimiento",
                quality: "HD",
                url: "https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8",
                tag: "AGAPE",
                desc: "Señal en vivo de Ágape TV."
            }
        ];

        function loadStream(url) {
            if (hlsPlayer) {
                hlsPlayer.destroy();
            }

            if (Hls.isSupported()) {
                hlsPlayer = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => console.log("Autoplay silenciado."));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() { video.play(); });
            }
        }

        function playChannelTV(channel, element) {
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            document.getElementById('current-channel-title').textContent = channel.name;
            document.getElementById('current-channel-desc').textContent = channel.desc;

            loadStream(channel.url);
        }

        function renderChannelsTV() {
            const listContainer = document.getElementById('channel-list');
            listContainer.innerHTML = '';

            const filtered = currentCategory === 'Todas' ? channels : channels.filter(c => c.category === currentCategory);

            filtered.forEach((ch, index) => {
                const li = document.createElement('li');
                li.className = `channel-item ${index === 0 ? 'active' : ''}`;
                let tagText = ch.tag || ch.name.substring(0, 4).toUpperCase();

                li.innerHTML = `
                    <div class="logo-box"><span>${tagText}</span></div>
                    <div class="channel-details">
                        <h4>${ch.name} <span class="badge-tag">${ch.quality}</span></h4>
                        <span>${ch.category}</span>
                    </div>
                `;
                li.onclick = () => playChannelTV(ch, li);
                listContainer.appendChild(li);
            });

            if (filtered.length > 0) playChannelTV(filtered[0], listContainer.children[0]);
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim().includes(cat) || (cat === 'Todas' && btn.textContent === 'Todas'));
            });
            renderChannelsTV();
        }

        renderChannelsTV();
    </script>
</body>
</html>
