<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTV IP - Plataforma IPTV</title>
    <!-- Librería HLS para streaming móvil -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Módulos de Firebase Compatible -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3b82f6;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-admin-nav {
            background-color: #334155;
            color: #ffffff;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-live {
            background-color: #ef4444;
            color: white;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
        }

        @media (min-width: 900px) {
            .main-container { flex-direction: row; }
        }

        .player-section {
            width: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 900px) {
            .player-section { flex: 3; }
        }

        .video-wrapper {
            width: 100%;
            position: relative;
            padding-top: 56.25%;
            background-color: #000;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .channel-info {
            padding: 15px;
            background-color: #1e293b;
        }

        .channel-info h2 {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .channel-info p {
            color: #94a3b8;
            font-size: 13px;
        }

        .sidebar {
            width: 100%;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 900px) {
            .sidebar {
                flex: 1;
                min-width: 320px;
                max-width: 400px;
                border-left: 1px solid #334155;
                height: calc(100vh - 57px);
            }
        }

        .category-filter {
            padding: 10px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .cat-btn {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 16px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-btn.active {
            background: #2563eb;
            font-weight: bold;
        }

        .channel-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
        }

        .channel-item:active, .channel-item.active {
            background-color: #2563eb;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            margin-right: 12px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
        }

        .channel-details h4 {
            font-size: 14px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .channel-details span {
            font-size: 12px;
            color: #94a3b8;
        }

        .badge-tag {
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
            background: #3b82f6;
            color: #fff;
        }

        /* Modal Administrador */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f172a;
            z-index: 1000;
            overflow-y: auto;
            padding: 15px;
        }

        .admin-modal.active { display: block; }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .admin-grid { grid-template-columns: 1fr 1fr; }
        }

        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #334155;
        }

        .card h3 { margin-bottom: 15px; color: #60a5fa; font-size: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 12px; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px;
        }

        .btn {
            background-color: #2563eb; color: white; border: none;
            padding: 10px 15px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 13px; width: 100%; margin-top: 5px;
        }

        .btn-danger { background-color: #ef4444; width: auto; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; font-size: 12px; }
        th { background-color: #0f172a; color: #60a5fa; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌐 GLOBAL TV IP</div>
        <div class="nav-controls">
            <span class="badge-live">EN VIVO</span>
            <button class="btn-admin-nav" onclick="openAdmin()">⚙️ Admin</button>
        </div>
    </header>

    <div class="main-container">
        <div class="player-section">
            <div class="video-wrapper">
                <video id="video-player" controls playsinline webkit-playsinline muted autoplay></video>
            </div>
            <div class="channel-info">
                <h2 id="current-channel-title">Cargando señales...</h2>
                <p id="current-channel-desc">Conectando con el servidor Firebase.</p>
            </div>
        </div>

        <div class="sidebar">
            <div class="category-filter">
                <button class="cat-btn active" onclick="filterCategory('Todas')">Todas</button>
                <button class="cat-btn" onclick="filterCategory('Canal Propio')">Propio</button>
                <button class="cat-btn" onclick="filterCategory('Noticias')">Noticias</button>
                <button class="cat-btn" onclick="filterCategory('Deportes')">Deportes</button>
                <button class="cat-btn" onclick="filterCategory('Entretenimiento')">Entretenimiento</button>
            </div>
            <ul class="channel-list" id="channel-list"></ul>
        </div>
    </div>

    <!-- Modal Admin -->
    <div id="admin-modal" class="admin-modal">
        <div class="admin-header">
            <h3>⚙️ Panel Administrador (Firebase Cloud)</h3>
            <button class="btn btn-danger" onclick="closeAdmin()">Cerrar</button>
        </div>
        <div class="admin-grid">
            <div class="card">
                <h3>Guardar Canal en la Nube</h3>
                <div class="form-group"><label>Nombre del Canal</label><input type="text" id="chan-name" placeholder="Ej: Canal 10 HD"></div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="chan-cat">
                        <option value="Canal Propio">Canal Propio</option>
                        <option value="Noticias">Noticias</option>
                        <option value="Deportes">Deportes</option>
                        <option value="Entretenimiento">Entretenimiento</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Calidad</label>
                    <select id="chan-quality"><option value="HD">HD</option><option value="4K">4K</option><option value="SD">SD</option></select>
                </div>
                <div class="form-group"><label>URL Stream (.m3u8 HTTPS)</label><input type="url" id="chan-url" placeholder="https://servidor.com/live.m3u8"></div>
                <div class="form-group"><label>Descripción</label><textarea id="chan-desc" rows="2" placeholder="Detalles del canal..."></textarea></div>
                <button class="btn" onclick="saveChannel()">☁️ Guardar Canal Globalmente</button>
            </div>
            <div class="card">
                <h3>Canales en Nube (<span id="chan-count">0</span>)</h3>
                <div style="max-height: 300px; overflow-y: auto;">
                    <table>
                        <thead><tr><th>Nombre</th><th>Cat.</th><th>Acción</th></tr></thead>
                        <tbody id="channels-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN REAL DE TUS CREDENCIALES OBTENIDAS DE LA CAPTURA DE PANTALLA
        const firebaseConfig = {
            apiKey: "AIzaSyCXp5Mzk0jCPtTG3co9tL2b23f5_RtBg58",
            authDomain: "global-tv-65143.firebaseapp.com",
            databaseURL: "https://global-tv-65143-default-rtdb.firebaseio.com",
            projectId: "global-tv-65143",
            storageBucket: "global-tv-65143.firebasestorage.app",
            messagingSenderId: "428782249833",
            appId: "1:428782249833:web:d061aac728a170e8803ff8"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const channelsRef = db.ref('iptv_channels');

        const ADMIN_PASS = "admin123";
        const video = document.getElementById('video-player');
        let hlsPlayer = null;
        let currentCategory = 'Todas';
        let channels = [];

        // Escuchar cambios de la nube en tiempo real
        channelsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            channels = [];
            
            if (data) {
                Object.keys(data).forEach(key => {
                    channels.push({ firebaseId: key, ...data[key] });
                });
            } else {
                // Si la base de datos recién creada está vacía, se cargan los canales iniciales
                const initialChannels = [
                    {
                        name: "Mi Canal TV",
                        category: "Canal Propio",
                        quality: "HD",
                        url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
                        tag: "MI TV",
                        desc: "Canal exclusivo las 24 horas."
                    },
                    {
                        name: "AGAPE TV HD",
                        category: "Entretenimiento",
                        quality: "HD",
                        url: "https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8",
                        tag: "AGAPE",
                        desc: "Señal en vivo de Ágape TV."
                    }
                ];
                initialChannels.forEach(item => channelsRef.push(item));
            }
            renderChannelsTV();
            renderTableAdmin();
        });

        function loadStream(url) {
            if (hlsPlayer) hlsPlayer.destroy();

            if (Hls.isSupported()) {
                hlsPlayer = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => console.log("Autoplay silenciado por el navegador."));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() { video.play(); });
            }
        }

        function playChannelTV(channel, element) {
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            document.getElementById('current-channel-title').textContent = channel.name;
            document.getElementById('current-channel-desc').textContent = channel.desc;

            loadStream(channel.url);
        }

        function renderChannelsTV() {
            const listContainer = document.getElementById('channel-list');
            listContainer.innerHTML = '';

            const filtered = currentCategory === 'Todas' ? channels : channels.filter(c => c.category === currentCategory);

            if (filtered.length === 0) {
                listContainer.innerHTML = `<li style="padding: 15px; text-align: center; color: #94a3b8; font-size: 13px;">No hay canales en esta categoría.</li>`;
                return;
            }

            filtered.forEach((ch, index) => {
                const li = document.createElement('li');
                li.className = `channel-item ${index === 0 ? 'active' : ''}`;
                let tagText = ch.tag || ch.name.substring(0, 4).toUpperCase();

                li.innerHTML = `
                    <div class="logo-box"><span>${tagText}</span></div>
                    <div class="channel-details">
                        <h4>${ch.name} <span class="badge-tag">${ch.quality}</span></h4>
                        <span>${ch.category}</span>
                    </div>
                `;
                li.onclick = () => playChannelTV(ch, li);
                listContainer.appendChild(li);
            });

            if (filtered.length > 0 && (!video.src || video.src === '')) {
                playChannelTV(filtered[0], listContainer.children[0]);
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim().includes(cat) || (cat === 'Todas' && btn.textContent === 'Todas'));
            });
            renderChannelsTV();
        }

        function openAdmin() {
            const pass = prompt("🔐 Clave de Administrador:");
            if (pass === ADMIN_PASS) {
                document.getElementById('admin-modal').classList.add('active');
                renderTableAdmin();
            } else if (pass !== null) alert("❌ Clave incorrecta");
        }

        function closeAdmin() {
            document.getElementById('admin-modal').classList.remove('active');
        }

        function saveChannel() {
            const name = document.getElementById('chan-name').value;
            const category = document.getElementById('chan-cat').value;
            const quality = document.getElementById('chan-quality').value;
            const url = document.getElementById('chan-url').value;
            const desc = document.getElementById('chan-desc').value || 'Sin descripción.';

            if (!name || !url) { alert('Completa el nombre y la URL .m3u8'); return; }

            const newChan = {
                name,
                category,
                quality,
                url,
                desc,
                tag: name.substring(0, 4).toUpperCase()
            };

            channelsRef.push(newChan)
                .then(() => {
                    document.getElementById('chan-name').value = '';
                    document.getElementById('chan-url').value = '';
                    document.getElementById('chan-desc').value = '';
                    alert('☁️ ¡Canal guardado en Firebase! Ahora se verá en todos los celulares.');
                })
                .catch((err) => alert('Error al guardar: ' + err.message));
        }

        function deleteChannel(firebaseId) {
            if (confirm('¿Deseas eliminar este canal globalmente?')) {
                channelsRef.child(firebaseId).remove();
            }
        }

        function renderTableAdmin() {
            const tbody = document.getElementById('channels-table-body');
            document.getElementById('chan-count').textContent = channels.length;
            tbody.innerHTML = '';
            channels.forEach(ch => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><strong>${ch.name}</strong></td><td>${ch.category}</td><td><button class="btn btn-danger" style="padding: 4px 8px; font-size:11px;" onclick="deleteChannel('${ch.firebaseId}')">Eliminar</button></td>`;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
