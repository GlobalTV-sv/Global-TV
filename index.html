<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTV IP - Plataforma IPTV</title>
    <!-- HLS.js Library para máxima compatibilidad móvil -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: #1e293b;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3b82f6;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-admin-nav {
            background-color: #334155;
            color: #ffffff;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-live {
            background-color: #ef4444;
            color: white;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Container Principal */
        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
        }

        @media (min-width: 900px) {
            .main-container {
                flex-direction: row;
            }
        }

        /* Reproductor */
        .player-section {
            width: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 900px) {
            .player-section {
                flex: 3;
            }
        }

        .video-wrapper {
            width: 100%;
            position: relative;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .play-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }

        .play-overlay.active {
            display: flex;
        }

        .play-btn-big {
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
        }

        .channel-info {
            padding: 15px;
            background-color: #1e293b;
        }

        .channel-info h2 {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .channel-info p {
            color: #94a3b8;
            font-size: 13px;
        }

        /* Sidebar */
        .sidebar {
            width: 100%;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 900px) {
            .sidebar {
                flex: 1;
                min-width: 320px;
                max-width: 400px;
                border-left: 1px solid #334155;
                height: calc(100vh - 57px);
            }
        }

        .category-filter {
            padding: 10px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .cat-btn {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 16px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-btn.active {
            background: #2563eb;
            font-weight: bold;
        }

        .channel-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
        }

        .channel-item:active, .channel-item.active {
            background-color: #2563eb;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            margin-right: 12px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .channel-details h4 {
            font-size: 14px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .channel-details span {
            font-size: 12px;
            color: #94a3b8;
        }

        .badge-tag {
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
        }

        .badge-hd { background: #3b82f6; color: #fff; }
        .badge-4k { background: #f59e0b; color: #000; }
        .badge-own { background: #8b5cf6; color: #fff; }

        /* Modal Admin */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f172a;
            z-index: 1000;
            overflow-y: auto;
            padding: 15px;
        }

        .admin-modal.active { display: block; }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .admin-grid { grid-template-columns: 1fr 1fr; }
        }

        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #334155;
        }

        .card h3 { margin-bottom: 15px; color: #60a5fa; font-size: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 12px; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px;
        }

        .btn {
            background-color: #2563eb; color: white; border: none;
            padding: 10px 15px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 13px; width: 100%; margin-top: 5px;
        }

        .btn-danger { background-color: #ef4444; width: auto; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; font-size: 12px; }
        th { background-color: #0f172a; color: #60a5fa; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌐 GLOBAL TV IP</div>
        <div class="nav-controls">
            <span class="badge-live">EN VIVO</span>
            <button class="btn-admin-nav" onclick="openAdmin()">⚙️ Admin</button>
        </div>
    </header>

    <div class="main-container">
        <div class="player-section">
            <div class="video-wrapper">
                <video id="video-player" controls playsinline webkit-playsinline muted autoplay></video>
                <div id="play-overlay" class="play-overlay" onclick="startPlayback()">
                    <button class="play-btn-big">▶ Toca para Reproducir</button>
                </div>
            </div>
            <div class="channel-info">
                <h2 id="current-channel-title">Cargando señal...</h2>
                <p id="current-channel-desc">Selecciona un canal para iniciar.</p>
            </div>
        </div>

        <div class="sidebar">
            <div class="category-filter">
                <button class="cat-btn active" onclick="filterCategory('Todas')">Todas</button>
                <button class="cat-btn" onclick="filterCategory('Canal Propio')">Propio</button>
                <button class="cat-btn" onclick="filterCategory('Noticias')">Noticias</button>
                <button class="cat-btn" onclick="filterCategory('Deportes')">Deportes</button>
                <button class="cat-btn" onclick="filterCategory('Entretenimiento')">Entretenimiento</button>
            </div>
            <ul class="channel-list" id="channel-list"></ul>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="admin-modal">
        <div class="admin-header">
            <h3>⚙️ Panel Administrador</h3>
            <button class="btn btn-danger" onclick="closeAdmin()">Cerrar</button>
        </div>
        <div class="admin-grid">
            <div class="card">
                <h3>Ingresar Nueva Señal</h3>
                <div class="form-group"><label>Nombre</label><input type="text" id="chan-name"></div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="chan-cat">
                        <option value="Canal Propio">Canal Propio</option>
                        <option value="Noticias">Noticias</option>
                        <option value="Deportes">Deportes</option>
                        <option value="Entretenimiento">Entretenimiento</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Calidad</label>
                    <select id="chan-quality"><option value="HD">HD</option><option value="4K">4K</option></select>
                </div>
                <div class="form-group"><label>URL Stream (.m3u8)</label><input type="url" id="chan-url"></div>
                <div class="form-group"><label>URL Logo</label><input type="url" id="chan-logo"></div>
                <div class="form-group"><label>Descripción</label><textarea id="chan-desc" rows="2"></textarea></div>
                <button class="btn" onclick="saveChannel()">💾 Guardar Canal</button>
            </div>
            <div class="card">
                <h3>Canales Registrados (<span id="chan-count">0</span>)</h3>
                <div style="max-height: 300px; overflow-y: auto;">
                    <table>
                        <thead><tr><th>Nombre</th><th>Cat.</th><th>Acción</th></tr></thead>
                        <tbody id="channels-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "admin123";
        const video = document.getElementById('video-player');
        const overlay = document.getElementById('play-overlay');
        let hls = null;
        let currentCategory = 'Todas';

        const defaultChannels = [
            {
                id: 1,
                name: "Mi Canal TV",
                category: "Canal Propio",
                quality: "HD",
                url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
                logo: "",
                tag: "MI TV",
                desc: "Canal exclusivo con transmisión las 24 horas."
            },
            {
                id: 2,
                name: "Noticias Global HD",
                category: "Noticias",
                quality: "HD",
                url: "https://cdn.jwplayer.com/manifests/pBScAFlM.m3u8",
                logo: "",
                tag: "NEWS",
                desc: "Información y noticias internacionales."
            },
            {
                id: 3,
                name: "AGAPE TV HD",
                category: "Entretenimiento",
                quality: "HD",
                url: "https://d2e1asnsl7br7b.cloudfront.net/out/v1/450c26c6d0ae4e86a512702b8006a88e/index.m3u8",
                logo: "https://via.placeholder.com/40/10b981/ffffff?text=AGAPE",
                tag: "AGAPE",
                desc: "Señal en vivo de Ágape TV El Salvador."
            }
        ];

        let localSaved = JSON.parse(localStorage.getItem('iptv_channels')) || [];
        let channels = [...defaultChannels];
        localSaved.forEach(item => {
            if (!channels.some(c => c.url === item.url)) channels.push(item);
        });

        function playStream(url) {
            overlay.classList.remove('active');
            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => overlay.classList.add('active'));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Soporte nativo para iOS Safari
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(() => overlay.classList.add('active'));
                });
            }
        }

        function startPlayback() {
            video.muted = false;
            video.play();
            overlay.classList.remove('active');
        }

        function playChannelTV(channel, element) {
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            document.getElementById('current-channel-title').textContent = channel.name;
            document.getElementById('current-channel-desc').textContent = channel.desc;

            playStream(channel.url);
        }

        function renderChannelsTV() {
            const listContainer = document.getElementById('channel-list');
            listContainer.innerHTML = '';

            const filtered = currentCategory === 'Todas' ? channels : channels.filter(c => c.category === currentCategory);

            filtered.forEach((ch, index) => {
                const li = document.createElement('li');
                li.className = `channel-item ${index === 0 ? 'active' : ''}`;
                let tagText = ch.tag || ch.name.substring(0, 4).toUpperCase();
                let logoContent = ch.logo ? `<img src="${ch.logo}" onerror="this.parentNode.innerHTML='<span>${tagText}</span>'">` : `<span>${tagText}</span>`;

                li.innerHTML = `
                    <div class="logo-box">${logoContent}</div>
                    <div class="channel-details">
                        <h4>${ch.name} <span class="badge-tag badge-hd">${ch.quality}</span></h4>
                        <span>${ch.category}</span>
                    </div>
                `;
                li.onclick = () => playChannelTV(ch, li);
                listContainer.appendChild(li);
            });

            if (filtered.length > 0) playChannelTV(filtered[0], listContainer.children[0]);
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim().includes(cat) || (cat === 'Todas' && btn.textContent === 'Todas'));
            });
            renderChannelsTV();
        }

        function openAdmin() {
            const pass = prompt("🔐 Clave de Administrador:");
            if (pass === ADMIN_PASS) {
                document.getElementById('admin-modal').classList.add('active');
                renderTableAdmin();
            } else if (pass !== null) alert("❌ Clave incorrecta");
        }

        function closeAdmin() {
            document.getElementById('admin-modal').classList.remove('active');
            renderChannelsTV();
        }

        function saveChannel() {
            const name = document.getElementById('chan-name').value;
            const category = document.getElementById('chan-cat').value;
            const quality = document.getElementById('chan-quality').value;
            const url = document.getElementById('chan-url').value;
            const logo = document.getElementById('chan-logo').value;
            const desc = document.getElementById('chan-desc').value || 'Sin descripción.';

            if (!name || !url) { alert('Completa nombre y URL .m3u8'); return; }

            const newChan = { id: Date.now(), name, category, quality, url, logo, desc, tag: name.substring(0, 4).toUpperCase() };
            channels.push(newChan);
            localSaved.push(newChan);
            localStorage.setItem('iptv_channels', JSON.stringify(localSaved));

            renderTableAdmin();
            alert('✅ Canal guardado');
        }

        function deleteChannel(id) {
            if (confirm('¿Eliminar canal?')) {
                channels = channels.filter(c => c.id !== id);
                localSaved = localSaved.filter(c => c.id !== id);
                localStorage.setItem('iptv_channels', JSON.stringify(localSaved));
                renderTableAdmin();
            }
        }

        function renderTableAdmin() {
            const tbody = document.getElementById('channels-table-body');
            document.getElementById('chan-count').textContent = channels.length;
            tbody.innerHTML = '';
            channels.forEach(ch => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><strong>${ch.name}</strong></td><td>${ch.category}</td><td><button class="btn btn-danger" style="padding: 4px 8px; font-size:11px;" onclick="deleteChannel(${ch.id})">Eliminar</button></td>`;
                tbody.appendChild(tr);
            });
        }

        renderChannelsTV();
    </script>
</body>
</html>
