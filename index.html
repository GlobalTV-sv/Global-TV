<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTV IP - Plataforma IPTV</title>
    <!-- Video.js CSS para reproducción de flujos HLS (.m3u8) -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Encabezado */
        header {
            background-color: #1e293b;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3b82f6;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-admin-nav {
            background-color: #334155;
            color: #ffffff;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-live {
            background-color: #ef4444;
            color: white;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Layout Principal */
        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
        }

        @media (min-width: 900px) {
            .main-container {
                flex-direction: row;
            }
        }

        /* Reproductor de Vídeo */
        .player-section {
            width: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 900px) {
            .player-section {
                flex: 3;
            }
        }

        .video-wrapper {
            width: 100%;
            position: relative;
            padding-top: 56.25%; /* Relación de aspecto 16:9 */
        }

        .video-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }

        .channel-info {
            padding: 15px;
            background-color: #1e293b;
        }

        .channel-info h2 {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .channel-info p {
            color: #94a3b8;
            font-size: 13px;
        }

        /* Guía de Canales (Sidebar) */
        .sidebar {
            width: 100%;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 900px) {
            .sidebar {
                flex: 1;
                min-width: 320px;
                max-width: 400px;
                border-left: 1px solid #334155;
                height: calc(100vh - 57px);
            }
        }

        .category-filter {
            padding: 10px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .cat-btn {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 16px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-btn.active {
            background: #2563eb;
            font-weight: bold;
        }

        .channel-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
        }

        .channel-item:active, .channel-item.active {
            background-color: #2563eb;
        }

        .channel-item img {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            margin-right: 12px;
            object-fit: cover;
            background: #334155;
        }

        .channel-details h4 {
            font-size: 14px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .channel-details span {
            font-size: 12px;
            color: #94a3b8;
        }

        .channel-item.active .channel-details span {
            color: #cbd5e1;
        }

        .badge-tag {
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
        }

        .badge-hd { background: #3b82f6; color: #fff; }
        .badge-4k { background: #f59e0b; color: #000; }
        .badge-own { background: #8b5cf6; color: #fff; }

        /* Panel Administrador Modal */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f172a;
            z-index: 1000;
            overflow-y: auto;
            padding: 15px;
        }

        .admin-modal.active {
            display: block;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .admin-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #334155;
        }

        .card h3 {
            margin-bottom: 15px;
            color: #60a5fa;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: #cbd5e1;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            width: 100%;
            margin-top: 5px;
        }

        .btn-danger { background-color: #ef4444; width: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #334155;
            font-size: 12px;
        }

        th { background-color: #0f172a; color: #60a5fa; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            🌐 GLOBAL TV IP
        </div>
        <div class="nav-controls">
            <span class="badge-live">EN VIVO</span>
            <button class="btn-admin-nav" onclick="openAdmin()">⚙️ Admin</button>
        </div>
    </header>

    <!-- Reproductor + Lista de Canales -->
    <div class="main-container">
        <div class="player-section">
            <div class="video-wrapper">
                <video id="main-player" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay playsinline preload="auto">
                    <source src="" type="application/x-mpegURL">
                </video>
            </div>
            <div class="channel-info">
                <h2 id="current-channel-title">Cargando canales...</h2>
                <p id="current-channel-desc">Selecciona un canal para reproducir.</p>
            </div>
        </div>

        <div class="sidebar">
            <div class="category-filter">
                <button class="cat-btn active" onclick="filterCategory('Todas')">Todas</button>
                <button class="cat-btn" onclick="filterCategory('Canal Propio')">Propio</button>
                <button class="cat-btn" onclick="filterCategory('Noticias')">Noticias</button>
                <button class="cat-btn" onclick="filterCategory('Deportes')">Deportes</button>
                <button class="cat-btn" onclick="filterCategory('Entretenimiento')">Entretenimiento</button>
            </div>

            <ul class="channel-list" id="channel-list"></ul>
        </div>
    </div>

    <!-- Modal Administrador -->
    <div id="admin-modal" class="admin-modal">
        <div class="admin-header">
            <h3>⚙️ Panel Administrador</h3>
            <button class="btn btn-danger" onclick="closeAdmin()">Cerrar</button>
        </div>

        <div class="admin-grid">
            <div class="card">
                <h3>Ingresar Nueva Señal</h3>
                
                <div class="form-group">
                    <label>Nombre del Canal</label>
                    <input type="text" id="chan-name" placeholder="Ej: Canal 10 HD">
                </div>

                <div class="form-group">
                    <label>Categoría</label>
                    <select id="chan-cat">
                        <option value="Canal Propio">Canal Propio</option>
                        <option value="Noticias">Noticias</option>
                        <option value="Deportes">Deportes</option>
                        <option value="Entretenimiento">Entretenimiento</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Calidad</label>
                    <select id="chan-quality">
                        <option value="HD">HD</option>
                        <option value="4K">4K</option>
                        <option value="SD">SD</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Enlace del Stream (.m3u8)</label>
                    <input type="url" id="chan-url" placeholder="https://servidor.com/live.m3u8">
                </div>

                <div class="form-group">
                    <label>URL del Logo (Opcional)</label>
                    <input type="url" id="chan-logo" placeholder="https://servidor.com/logo.png">
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="chan-desc" rows="2" placeholder="Detalles del canal..."></textarea>
                </div>

                <button class="btn" onclick="saveChannel()">💾 Guardar Canal</button>
            </div>

            <div class="card">
                <h3>Canales Registrados (<span id="chan-count">0</span>)</h3>
                <div style="max-height: 300px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Cat.</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="channels-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Video.js y Lógica de Aplicación -->
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        const ADMIN_PASS = "admin123";
        const mainPlayer = videojs('main-player');
        let currentCategory = 'Todas';

        // 📌 CANALES GLOBALES FIJOS (Sustituye o agrega aquí tus señales permanentes)
        const defaultChannels = [
            {
                id: 1,
                name: "Mi Canal TV",
                category: "Canal Propio",
                quality: "HD",
                url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
                logo: "https://via.placeholder.com/40/8b5cf6/ffffff?text=MI+TV",
                desc: "Canal exclusivo con transmisión las 24 horas."
            },
            {
                id: 2,
                name: "Noticias Global HD",
                category: "Noticias",
                quality: "HD",
                url: "https://cdn.jwplayer.com/manifests/pBScAFlM.m3u8",
                logo: "https://via.placeholder.com/40/3b82f6/ffffff?text=NEWS",
                desc: "Información y noticias internacionales."
            },
            {
                id: 3,
                name: "Cine & Acción 4K",
                category: "Entretenimiento",
                quality: "4K",
                url: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8",
                logo: "https://via.placeholder.com/40/f59e0b/000000?text=CINE",
                desc: "Películas y series en alta definición."
            }
        ];

        // Cargar canales guardados en la memoria del navegador y combinar con la lista fija
        let localSaved = JSON.parse(localStorage.getItem('iptv_channels')) || [];
        let channels = [...defaultChannels, ...localSaved];

        function openAdmin() {
            const pass = prompt("🔐 Clave de Administrador:");
            if (pass === ADMIN_PASS) {
                document.getElementById('admin-modal').classList.add('active');
                renderTableAdmin();
            } else if (pass !== null) {
                alert("❌ Clave incorrecta");
            }
        }

        function closeAdmin() {
            document.getElementById('admin-modal').classList.remove('active');
            renderChannelsTV();
        }

        function renderChannelsTV() {
            const listContainer = document.getElementById('channel-list');
            listContainer.innerHTML = '';

            const filtered = currentCategory === 'Todas' 
                ? channels 
                : channels.filter(c => c.category === currentCategory);

            if (filtered.length === 0) {
                listContainer.innerHTML = `<li style="padding: 15px; text-align: center; color: #94a3b8; font-size: 13px;">No hay canales en esta categoría.</li>`;
                return;
            }

            filtered.forEach((ch, index) => {
                const li = document.createElement('li');
                li.className = `channel-item ${index === 0 ? 'active' : ''}`;
                
                let badgeClass = ch.category === 'Canal Propio' ? 'badge-own' : 'badge-hd';

                li.innerHTML = `
                    <img src="${ch.logo}" alt="Logo">
                    <div class="channel-details">
                        <h4>${ch.name} <span class="badge-tag ${badgeClass}">${ch.quality}</span></h4>
                        <span>${ch.category}</span>
                    </div>
                `;

                li.onclick = () => playChannelTV(ch, li);
                listContainer.appendChild(li);
            });

            if (filtered.length > 0) {
                playChannelTV(filtered[0], listContainer.children[0]);
            }
        }

        function playChannelTV(channel, element) {
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            document.getElementById('current-channel-title').textContent = channel.name;
            document.getElementById('current-channel-desc').textContent = channel.desc;

            mainPlayer.src({ src: channel.url, type: 'application/x-mpegURL' });
            mainPlayer.play();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim().includes(cat) || (cat === 'Todas' && btn.textContent === 'Todas'));
            });
            renderChannelsTV();
        }

        function saveChannel() {
            const name = document.getElementById('chan-name').value;
            const category = document.getElementById('chan-cat').value;
            const quality = document.getElementById('chan-quality').value;
            const url = document.getElementById('chan-url').value;
            const logo = document.getElementById('chan-logo').value || 'https://via.placeholder.com/40/3b82f6/ffffff?text=TV';
            const desc = document.getElementById('chan-desc').value || 'Sin descripción.';

            if (!name || !url) {
                alert('Por favor completa el nombre y el enlace .m3u8');
                return;
            }

            const newChan = { id: Date.now(), name, category, quality, url, logo, desc };
            channels.push(newChan);
            
            localSaved.push(newChan);
            localStorage.setItem('iptv_channels', JSON.stringify(localSaved));

            document.getElementById('chan-name').value = '';
            document.getElementById('chan-url').value = '';
            document.getElementById('chan-logo').value = '';
            document.getElementById('chan-desc').value = '';

            renderTableAdmin();
            alert('✅ Canal guardado correctamente');
        }

        function deleteChannel(id) {
            if (confirm('¿Eliminar este canal?')) {
                channels = channels.filter(c => c.id !== id);
                localSaved = localSaved.filter(c => c.id !== id);
                localStorage.setItem('iptv_channels', JSON.stringify(localSaved));
                renderTableAdmin();
            }
        }

        function renderTableAdmin() {
            const tbody = document.getElementById('channels-table-body');
            document.getElementById('chan-count').textContent = channels.length;
            tbody.innerHTML = '';

            channels.forEach(ch => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${ch.name}</strong></td>
                    <td>${ch.category}</td>
                    <td><button class="btn btn-danger" style="padding: 4px 8px; font-size:11px;" onclick="deleteChannel(${ch.id})">Eliminar</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderChannelsTV();
    </script>
</body>
</html>
